# Render infrastructure-as-code for bolt.diy.
#
# Two ways to use this file:
#   1. Dashboard: New + -> Blueprint -> connect this repo. Render reads this file.
#   2. Manual: New + -> Web Service with "Runtime: Docker". That works too: a
#      plain `docker build .` cannot pass --target, so whatever stage is LAST is
#      what ships - and the last stage here is `node-runtime`, the low-memory
#      production runtime (the older wrangler-based image is still available as
#      `--target bolt-ai-production` for docker compose users).
#
# Secrets are never stored here: `sync: false` means "leave whatever is set in
# the dashboard alone" (Dashboard -> Service -> Environment, "Secret" type).
#
# Note on VITE_* variables: those are inlined into the browser bundle at build
# time, so Render's runtime env vars cannot change them - set them as build
# arguments (Render: Service Settings -> Build & Cloud -> Environment Variables
# with "Build" scope) if you want e.g. VITE_DEFAULT_PROVIDER=DashScope to be the
# provider a fresh chat opens with. Server-side variables (everything without the
# VITE_ prefix) are read at runtime and are the only place API keys belong: a
# VITE_* key ships to every visitor's browser.
services:
  - type: web
    name: bolt-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    region: singapore
    # Fits the free tier. It used to need 2 GB because the image booted the app
    # inside `wrangler pages dev` (Cloudflare's workerd harness, ~850 MB at idle
    # before the app got a single byte). `server.mjs` - the last stage of the
    # Dockerfile - serves the identical build output on plain Node V8: ~130 MB
    # idle, ~270 MB peak, so 512 MB is enough. Nothing CF-specific is dropped:
    # the only Cloudflare API this app reads is `context.cloudflare?.env`, which
    # server.mjs fills from process.env, so the keys below work at runtime with
    # no rebuild (previously they had to be baked in at build time).
    #
    # What the free tier still costs you: it sleeps ~15 min after the last
    # request, so the next visitor pays a cold start, and 0.1 CPU means the first
    # SSR render is a few seconds. Cloudflare Pages free has no sleep and no CPU
    # cap per request, so it stays the better free home for a busy app; Render
    # free is the better free home when you want env vars, a Dockerfile and
    # no wrangler in the loop.
    plan: free
    healthCheckPath: /
    envVars:
      # ---- Alibaba Cloud Model Studio / DashScope (Qwen, DeepSeek, Kimi, GLM) ----
      - key: DASHSCOPE_API_KEY
        sync: false
      # Dedicated (Singapore) workspace, OpenAI-compatible endpoint, e.g.
      # https://<workspace-id>.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      # Leave unset to use the shared international endpoint.
      - key: DASHSCOPE_BASE_URL
        sync: false

      # ---- xKiro ----
      - key: XKIRO_API_KEY
        sync: false
      - key: XKIRO_BASE_URL
        value: https://api.xkiro.com/v1

      # ---- Vercel: lets generated apps deploy without touching the Deploy menu ----
      - key: VERCEL_TOKEN
        sync: false

      # ---- optional extras ----
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VITE_LOG_LEVEL
        value: info
